.container{
  width: 100%;
}

@media (min-width: 640px){
  .container{
    max-width: 640px;
  }
}

@media (min-width: 768px){
  .container{
    max-width: 768px;
  }
}

@media (min-width: 1024px){
  .container{
    max-width: 1024px;
  }
}

@media (min-width: 1280px){
  .container{
    max-width: 1280px;
  }
}

@media (min-width: 1536px){
  .container{
    max-width: 1536px;
  }
}

.visible{
  visibility: visible;
}

.block{
  display: block;
}

.flex{
  display: flex;
}

.table{
  display: table;
}

.hidden{
  display: none;
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --ink:#14213d;
  --muted:#65718a;
  --blue:#1746a2;
  --blue2:#2563eb;
  --pale:#edf4ff;
  --line:#dfe6f0;
  --green:#13795b;
  --red:#b42318;
  --bg:#f5f7fb;
  --card:#fff;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;
  line-height:1.5
}

.top{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:12px max(18px,calc((100% - 1180px)/2));
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:5
}

.brand{
  display:flex;
  gap:10px;
  align-items:center
}

.brand b{
  display:block;
  font-family:Manrope,sans-serif
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:.8rem
}

.logo{
  background:var(--blue);
  color:white;
  border-radius:13px;
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  font-size:1.7rem;
  font-weight:800
}

main{
  max-width:1180px;
  margin:24px auto;
  padding:0 16px
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:0 8px 28px #18365c08
}

.hidden{
  display:none!important
}

.notice{
  background:#fff7df;
  border:1px solid #f0d78b;
  padding:13px 16px;
  border-radius:14px;
  margin-bottom:18px;
  color:#6e5200
}

.notice p{
  margin:4px 0 0
}

.auth{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  overflow:hidden;
  padding:0
}

.hero{
  padding:clamp(25px,5vw,60px);
  background:radial-gradient(circle at 80% 15%,#5d8ff4 0,transparent 28%),linear-gradient(140deg,#123b8c,#2764ce);
  color:white;
  min-height:420px;
  display:flex;
  flex-direction:column;
  justify-content:center
}

.eyebrow{
  font-size:.72rem;
  letter-spacing:.14em;
  font-weight:800;
  color:#5a78b6
}

.hero .eyebrow{
  color:#c6d9ff
}

.hero h1,.welcome h1{
  font-family:Manrope,sans-serif;
  line-height:1.1;
  font-size:clamp(2rem,4vw,3.5rem);
  margin:12px 0
}

.hero h1 span{
  color:#a9d8ff
}

.hero p{
  max-width:450px;
  color:#e0eaff;
  font-size:1.05rem
}

.mini-stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:22px
}

.mini-stats span{
  border:1px solid #ffffff55;
  background:#ffffff12;
  border-radius:30px;
  padding:7px 12px;
  font-size:.85rem
}

.authbox{
  padding:clamp(22px,4vw,42px);
  align-self:center
}

.tabs{
  display:flex;
  border-bottom:1px solid var(--line);
  gap:18px;
  margin-bottom:20px
}

.tab{
  background:none;
  border:0;
  padding:10px 2px;
  color:var(--muted);
  font-weight:700;
  border-bottom:3px solid transparent;
  cursor:pointer
}

.tab.active{
  color:var(--blue);
  border-color:var(--blue)
}

label{
  display:block;
  font-weight:600;
  font-size:.9rem;
  margin:13px 0
}

input,select{
  width:100%;
  padding:12px 13px;
  margin-top:6px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  font:inherit
}

input:focus,select:focus{
  outline:3px solid #bfdbfe;
  border-color:var(--blue2)
}

button{
  cursor:pointer;
  font:inherit;
  font-weight:700;
  border:0;
  border-radius:11px;
  padding:10px 14px
}

.primary{
  background:var(--blue);
  color:white
}

.primary:hover{
  background:#10367f
}

.secondary{
  background:#edf2fa;
  color:#213b68;
  border:1px solid #dbe4f2
}

.full{
  width:100%;
  margin-top:10px
}

.message{
  min-height:20px;
  font-size:.9rem;
  color:var(--red)
}

.muted{
  color:var(--muted)
}

.small{
  font-size:.82rem
}

.welcome{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:18px
}

.welcome h1{
  font-size:clamp(1.8rem,3vw,2.7rem)
}

.welcome p{
  color:var(--muted);
  margin-bottom:0
}

.score-pill{
  background:var(--pale);
  border-radius:16px;
  padding:14px 22px;
  text-align:center;
  min-width:120px
}

.score-pill small{
  display:block;
  color:var(--muted)
}

.score-pill strong{
  font-size:2rem;
  color:var(--blue)
}

.layout{
  display:grid;
  grid-template-columns:290px 1fr;
  gap:18px;
  align-items:start
}

.sidebar{
  position:sticky;
  top:84px
}

.sidebar h2,.lesson h2,.teacher-tools h2{
  font-family:Manrope,sans-serif;
  font-size:1.2rem;
  margin:0 0 14px
}

.module-list{
  display:grid;
  gap:7px;
  margin-bottom:16px
}

.module-btn{
  display:flex;
  gap:10px;
  align-items:center;
  text-align:left;
  background:white;
  border:1px solid transparent;
  padding:10px;
  border-radius:12px;
  color:var(--ink);
  font-weight:600
}

.module-btn:hover{
  background:#f4f7fc
}

.module-btn.active{
  background:var(--pale);
  border-color:#a9c6fa;
  color:var(--blue)
}

.module-btn .num{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  background:#edf1f7;
  border-radius:9px;
  flex-shrink:0
}

.module-btn.active .num{
  background:var(--blue);
  color:white
}

.module-btn .check{
  margin-left:auto;
  color:var(--green)
}

.lesson{
  min-height:450px
}

.lesson-header{
  display:flex;
  gap:12px;
  align-items:flex-start;
  justify-content:space-between
}

.lesson-header h1{
  font:800 clamp(1.4rem,3vw,2rem) Manrope,sans-serif;
  margin:5px 0
}

.tag{
  display:inline-block;
  background:var(--pale);
  color:var(--blue);
  padding:5px 9px;
  border-radius:8px;
  font-size:.78rem;
  font-weight:700
}

.lesson p{
  color:#3d4b63
}

.lesson h3{
  font:700 1.08rem Manrope,sans-serif;
  margin:24px 0 8px
}

.example{
  border:1px solid var(--line);
  background:#fbfcff;
  border-radius:13px;
  padding:14px;
  margin:10px 0
}

.mathline{
  font-size:1.25rem;
  font-weight:800;
  color:var(--blue);
  letter-spacing:.02em
}

.frac{
  display:inline-flex;
  flex-direction:column;
  vertical-align:middle;
  text-align:center;
  line-height:1.1;
  font-weight:800;
  margin:0 4px;
  min-width:24px
}

.frac .topnum{
  border-bottom:2px solid currentColor;
  padding:0 5px 3px
}

.frac .bottomnum{
  padding:3px 5px 0
}

.visual-bars{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0
}

.bar-whole{
  display:flex;
  gap:2px;
  min-width:130px;
  height:38px;
  padding:3px;
  border:1px solid #8aa9dc;
  border-radius:7px;
  background:#fff
}

.bar-whole span{
  flex:1;
  background:#eaf1fd;
  border-radius:3px
}

.bar-whole span.filled{
  background:#4f83e7
}

.question{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  margin-top:14px
}

.question-title{
  font-weight:700;
  margin-bottom:10px
}

.answers{
  display:grid;
  gap:8px
}

.answer{
  display:flex;
  gap:10px;
  align-items:center;
  border:1px solid var(--line);
  padding:10px;
  border-radius:10px;
  font-weight:500
}

.answer input{
  width:auto;
  margin:0
}

.feedback{
  padding:10px 12px;
  border-radius:10px;
  margin-top:10px;
  font-size:.92rem
}

.feedback.ok{
  background:#e5f8ef;
  color:#116149
}

.feedback.no{
  background:#fff0ee;
  color:#a1291f
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:16px
}

.empty{
  text-align:center;
  padding:55px 10px
}

.empty-icon{
  font-size:4rem;
  color:var(--blue)
}

.progress-track{
  height:8px;
  border-radius:20px;
  background:#e9eef6;
  overflow:hidden
}

.progress-track span{
  display:block;
  height:100%;
  background:#16a36b
}

.table-wrap{
  overflow:auto;
  margin:14px 0
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
  font-size:.9rem
}

th,td{
  padding:11px;
  text-align:left;
  border-bottom:1px solid var(--line)
}

th{
  background:#f7f9fc;
  color:#526079
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:16px 0
}

.summary-card{
  background:#f6f8fc;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px
}

.summary-card strong{
  font-size:1.7rem;
  display:block;
  color:var(--blue)
}

footer{
  max-width:1180px;
  margin:26px auto;
  padding:0 18px 24px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:.82rem
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#14213d;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  box-shadow:0 8px 25px #0002;
  z-index:10;
  display:none;
  max-width:90vw
}

.toast.show{
  display:block
}

@media(max-width:800px){
  .auth{
    grid-template-columns:1fr
  }

  .hero{
    min-height:auto;
    padding:30px
  }

  .layout{
    grid-template-columns:1fr
  }

  .sidebar{
    position:static
  }

  .module-list{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

  .module-btn{
    font-size:.83rem;
    padding:8px
  }

  .module-btn .num{
    width:26px;
    height:26px
  }

  .welcome{
    align-items:flex-start
  }

  .score-pill{
    min-width:92px;
    padding:10px
  }

  .score-pill strong{
    font-size:1.6rem
  }

  .summary-grid{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:440px){
  main{
    margin:14px auto;
    padding:0 10px
  }

  .panel{
    padding:16px;
    border-radius:15px
  }

  .module-list{
    grid-template-columns:1fr
  }

  .welcome{
    flex-direction:column
  }

  .score-pill{
    display:flex;
    align-items:center;
    gap:10px
  }

  .score-pill small{
    display:inline
  }

  .summary-grid{
    grid-template-columns:1fr
  }

  footer{
    flex-direction:column
  }
}
</style>
