}

:root{
  --ink:#14213d;
  --blue:#1746a2;
  --pale:#edf4ff;
  --line:#dfe6f0;
  --bg:#f7f9fd;
  --card:#ffffff;
  --muted:#66748b;
  --ok:#0e9f6e;
  --bad:#e11d48;
  --radius:20px;
  --shadow:0 10px 30px rgba(20,33,61,.08);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased
}

h1,h2,h3{
  font-family:"Fraunces",serif;
  letter-spacing:-.02em
}

/* original class names */

.top{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:40;
  background:rgba(255,255,255,.9);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px
}

.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  display:grid;
  place-items:center;
  font-family:"Fraunces",serif;
  font-weight:800;
  font-size:22px;
  letter-spacing:-.03em;
  box-shadow:0 8px 20px rgba(23,70,162,.25);
}

.brand-title{
  font-family:"Fraunces",serif;
  font-weight:800;
  font-size:18px;
  line-height:1
}

.brand-sub{
  font-size:12px;
  color:var(--muted);
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-top:2px
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.auth{
  max-width:1120px;
  margin:28px auto;
  padding:0 18px 40px;
  display:grid;
  grid-template-columns: 1.05fr .95fr;
  gap:22px;
  align-items:start;
}

.hero{
  background:var(--pale);
  border:1px solid #dbe6f9;
  border-radius:var(--radius);
  padding:28px;
  position:relative;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  right:-40px;
  top:-40px;
  width:220px;
  height:220px;
  background:radial-gradient(closest-side, #c7d9ff, transparent);
  opacity:.9;
  pointer-events:none;
}

.hero-kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
}

.hero h1{
  font-size:42px;
  line-height:.95;
  margin:18px 0 12px;
  max-width:10ch
}

.hero p{
  color:var(--muted);
  line-height:1.5;
  font-size:15px;
  margin:0
}

.hero-list{
  margin:22px 0 0;
  padding:0;
  list-style:none;
  display:grid;
  gap:12px
}

.hero-list li{
  display:flex;
  gap:12px;
  align-items:flex-start;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  font-size:14px
}

.hero-list b{
  font-weight:700
}

.bullet{
  width:28px;
  height:28px;
  border-radius:10px;
  background:var(--ink);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:13px;
  flex:0 0 28px
}

.authbox{
  padding:0;
  overflow:hidden
}

.tabs{
  display:flex;
  gap:2px;
  padding:8px 8px 0;
  background:#f3f6fb;
  border-bottom:1px solid var(--line)
}

.tab{
  flex:1;
  padding:12px 10px;
  border-radius:12px 12px 0 0;
  border:1px solid transparent;
  border-bottom:none;
  background:transparent;
  font-weight:700;
  font-size:14px;
  color:var(--muted);
  cursor:pointer;
}

.tab[aria-selected="true"]{
  background:#fff;
  border-color:var(--line);
  color:var(--ink);
  box-shadow:0 -2px 10px rgba(0,0,0,.03)
}

.form-wrap{
  padding:22px
}

.label{
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
  margin:14px 0 6px;
  display:block
}

.input, .select{
  width:100%;
  height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  padding:0 14px;
  font-size:14px;
  outline:none;
  transition:.15s;
}

.input:focus,.select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(23,70,162,.12)
}

.checkline{
  display:flex;
  align-items:center;
  gap:10px;
  margin:14px 0 6px;
  font-size:14px
}

.btn{
  height:44px;
  border-radius:12px;
  border:1px solid transparent;
  padding:0 16px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.15s;
}

.btn:active{
  transform:translateY(1px)
}

.btn-primary{
  background:var(--blue);
  color:#fff;
  box-shadow:0 10px 20px rgba(23,70,162,.2)
}

.btn-primary:hover{
  filter:brightness(1.05)
}

.btn-ghost{
  background:#fff;
  border-color:var(--line);
  color:var(--ink)
}

.btn-block{
  width:100%
}

.authMessage{
  margin-top:14px;
  min-height:22px;
  font-size:13px;
  font-weight:600;
  line-height:1.4
}

.authMessage.err{
  color:var(--bad)
}

.authMessage.ok{
  color:var(--ok)
}

.app-shell{
  max-width:1240px;
  margin:0 auto;
  padding:0 18px 48px
}

.layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:18px;
  margin-top:20px;
  align-items:start;
}

.sidebar{
  position:sticky;
  top:calc(var(--safe-area-inset-top) + 72px)
}

.side-card{
  padding:16px
}

.progress-ring{
  width:56px;
  height:56px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:conic-gradient(var(--blue) calc(var(--p)*1%), #eef2f8 0);
  font-weight:800
}

.mod-list{
  display:grid;
  gap:8px;
  margin-top:14px
}

.mod-btn{
  text-align:left;
  width:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 12px;
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
}

.mod-btn.active{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(23,70,162,.12)
}

.mod-num{
  width:30px;
  height:30px;
  border-radius:10px;
  background:var(--pale);
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:13px;
  color:var(--blue)
}

.mod-meta{
  flex:1;
  min-width:0
}

.mod-title{
  font-weight:700;
  font-size:13px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.mod-tag{
  font-size:11px;
  color:var(--muted);
  font-weight:600
}

.check{
  width:22px;
  height:22px;
  border-radius:999px;
  background:#e8f5ee;
  color:var(--ok);
  display:grid;
  place-items:center;
  font-size:12px
}

.lesson{
  padding:22px
}

.lesson-head{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:12px
}

.tag{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  background:var(--pale);
  color:var(--blue);
  font-weight:800;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  border:1px solid #d3e2ff
}

.lesson h2{
  font-size:30px;
  line-height:1;
  margin:8px 0
}

.lesson .exp{
  color:var(--muted);
  font-size:14px;
  line-height:1.6
}

.steps{
  margin:18px 0;
  display:grid;
  gap:10px
}

.step{
  display:flex;
  gap:12px;
  padding:12px 14px;
  background:#f8fbff;
  border:1px solid #e6eefc;
  border-radius:14px
}

.step b{
  font-family:"Fraunces",serif
}

.examples{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:18px 0
}

.frac-card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  background:#fff
}

.bar-track{
  height:18px;
  background:#eef3fb;
  border-radius:999px;
  overflow:hidden;
  display:flex;
  margin-top:8px;
  border:1px solid #e2e8f5
}

.bar-fill{
  height:100%;
  background:var(--blue)
}

.q-block{
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-top:14px;
  background:#fff
}

.q-title{
  font-weight:700;
  font-size:14px
}

.opts{
  display:grid;
  gap:8px;
  margin-top:10px
}

.opt{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  cursor:pointer;
  background:#fff
}

.opt:has(input:checked){
  border-color:var(--blue);
  background:#f4f7ff
}

.feedback{
  margin-top:8px;
  font-size:13px;
  font-weight:600
}

.result-box{
  margin-top:16px;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#f8fbff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.teacher-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:16px
}

.kpi{
  padding:16px
}

.kpi b{
  font-size:28px;
  font-family:"Fraunces",serif
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
  margin-top:14px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th,td{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap
}

th{
  background:#f7f9fd;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted)
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:12px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  box-shadow:0 16px 40px rgba(0,0,0,.25);
  z-index:100;
  max-width:90vw;
  text-align:center;
}

@media (max-width: 960px){
  .auth{
    grid-template-columns:1fr
  }

  .layout{
    grid-template-columns:1fr
  }

  .sidebar{
    position:relative;
    top:0
  }

  .examples{
    grid-template-columns:1fr
  }

  .teacher-grid{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:34px
  }
}
</style>
